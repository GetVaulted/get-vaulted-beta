# Shared across Netlify sites in this repo. Do not add [build] here — it merges into every site and,
# with Base directory `web`, turned publish "static" into web/static (missing) and broke Next deploys.
#
# App platform site (static + functions): Base = repo root. In Netlify UI set Publish = static,
# Functions = netlify/functions, Build command = npm install.
#
# Beta Next site: see web/netlify.toml (Base empty, Package directory = web).

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["stripe", "@aws-sdk/client-ivs"]
