      .hero {
        text-align: center;
        padding: 3rem 0 2rem;
      }
      .hero h1 {
        font-size: 2rem;
        margin: 0 0 0.5rem;
      }
      .hero p {
        color: var(--muted);

        margin: 0 auto 1.5rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      .links a {
        display: inline-block;
        padding: 0.65rem 1.1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        background: var(--surface);
      }
      .links a.primary {
        background: var(--gold);
        color: #050505;
        border-color: var(--gold);
      }
